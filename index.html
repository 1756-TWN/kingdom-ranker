<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kingdoms · MightPulse Ranking Checker</title>
  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #181b22;
      --text-color: #e2e8f0;
      --text-muted: #94a3b8;
      --border-color: #2a2f3d;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --success-bg: #1e3a8a;
      --error-bg: #450a0a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 24px;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    h2 {
      font-size: 1.25rem;
      margin-top: 0;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    select, input {
      width: 100%;
      padding: 10px 14px;
      box-sizing: border-box;
      background-color: #0b0d10;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input:focus {
      border-color: var(--accent-color);
    }

    button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button:active {
      transform: scale(0.99);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.95rem;
    }

    th {
      background-color: rgba(255, 255, 255, 0.02);
      font-weight: 600;
      color: var(--text-muted);
    }

    tr:hover td {
      background-color: rgba(255, 255, 255, 0.01);
    }

    .target-box {
      background-color: var(--success-bg);
      border: 1px solid #3b82f6;
      border-left: 4px solid var(--accent-color);
    }

    .error-box {
      background-color: var(--error-bg);
      border: 1px solid #ef4444;
      border-left: 4px solid #ef4444;
    }

    .loading {
      text-align: center;
      color: var(--text-muted);
      font-style: italic;
      padding: 20px;
    }
  </style>
</head>
<body>

  <h1>🏰 Kingdom Ranking Checker</h1>

  <div class="card">
    <div class="form-group">
      <label for="range">Kingdom Range:</label>
      <select id="range">
				<option value="1-417">Group 1: 1 - 417</option>
				<option value="418-587">Group 2: 418 - 587</option>
				<option value="588-927">Group 3: 588 - 927</option>
				<option value="928-1331">Group 4: 928 - 1331</option>
				<option value="1332-1426">Group 5: 1332 - 1426</option>
				<option value="1427-1689">Group 6: 1427 - 1689</option>
				<option value="1690-1935">Group 7: 1690 - 1935</option>
				<option value="1936-2050">Group 8: 1936 - 2050</option>
				<option value="2051-2105">Group 9: 2051 - 2105</option>
				<option value="2106-2234">Group 10: 2106 - 2234</option>
			</select>
      <!-- <input type="text" id="range" placeholder="1690-1935" value="1690-1935"> -->
    </div>
    <div class="form-group">
      <label for="kid">Target Kingdom ID (Optional):</label>
      <input type="number" id="kid" placeholder="e.g. 1756">
    </div>
    <button onclick="checkRankings()">Search & Rank</button>
  </div>

  <div id="loading" class="loading" style="display:none;">Fetching and calculating data...</div>

  <div id="results" style="display:none;">
    <div id="targetResult"></div>

    <div class="card">
      <h2 id="rangeTitle">Top 10 Kingdoms</h2>
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Kingdom ID (kid)</th>
            <th>Transfer Score (Unofficial)</th>
          </tr>
        </thead>
        <tbody id="top10Body"></tbody>
      </table>
    </div>
  </div>

  <script>
    async function checkRankings() {
      const rangeInput = document.getElementById("range");
      const range = rangeInput.value.trim();
      const kid = document.getElementById("kid").value.trim();
      const loading = document.getElementById("loading");
      const results = document.getElementById("results");
      const targetResult = document.getElementById("targetResult");
      const top10Body = document.getElementById("top10Body");
      const rangeTitle = document.getElementById("rangeTitle");

      rangeTitle.textContent = `Top 10 Kingdoms in ${range}`;

      loading.style.display = "block";
      results.style.display = "none";

      try {
        const response = await fetch(`/api/rankings?range=${encodeURIComponent(range)}&kid=${encodeURIComponent(kid)}`);
        const data = await response.json();

        if (data.error) {
          alert(data.error);
          return;
        }

        if (data.targetKingdom) {
          const tk = data.targetKingdom;
          if (tk.found) {
            targetResult.innerHTML = `
              <div class="card target-box">
                <h2>🔍 Search Result for Kingdom ${tk.kid}</h2>
                <p><strong>Rank:</strong> #${tk.rank} / ${tk.total}</p>
                <p style="margin-bottom:0;"><strong>Transfer Score (Unofficial):</strong> ${tk.score}</p>
              </div>`;
          } else {
            targetResult.innerHTML = `
              <div class="card error-box">
                <h2>⚠️ Kingdom ${tk.kid} Not Found</h2>
                <p style="margin-bottom:0;">Searched across ${tk.total} kingdoms in range ${range}.</p>
              </div>`;
          }
        } else {
          targetResult.innerHTML = "";
        }

        top10Body.innerHTML = data.leading.map(item => `
          <tr>
            <td><strong>#${item.rank}</strong></td>
            <td>${item.kid}</td>
            <td>${item.score}</td>
          </tr>
        `).join("");

        results.style.display = "block";
      } catch (err) {
        console.error(err);
        alert("Failed to connect to the server.");
      } finally {
        loading.style.display = "none";
      }
    }
  </script>
</body>
</html>
